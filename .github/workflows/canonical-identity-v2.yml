name: Canonical Identity v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-identity-v2.yml'

permissions:
  contents: write

env:
  CANONICAL_IDENTITY_VERSION: '2.0.0'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical identity fields safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='''        <fieldset style="border:0; padding:0; margin:0">\n          <legend class="visualmente-oculto">Itens do questionário</legend>'''
          if marker not in s:
              raise SystemExit('QUESTION_MARKER_MISSING')
          before, protected=s.split(marker,1)
          original_protected=protected
          if 'id="birthDate"' not in before:
              needle='''            <div>\n              <label for="fullName">Nome completo</label>\n              <input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Seu nome" />\n            </div>\n            <div>\n              <label for="date">Data do teste</label>\n              <input id="date" name="date" type="date" />\n            </div>'''
              replacement='''            <div>\n              <label for="fullName">Nome completo</label>\n              <input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Seu nome" required />\n            </div>\n            <div>\n              <label for="birthDate">Data de nascimento</label>\n              <input id="birthDate" name="birthDate" type="date" required />\n            </div>\n            <div>\n              <label for="date">Data de aplicação do rastreio</label>\n              <input id="date" name="date" type="date" required />\n            </div>'''
              if needle not in before:
                  raise SystemExit('IDENTITY_BLOCK_NOT_FOUND')
              before=before.replace(needle,replacement,1)
          out=before+marker+protected
          if out.split(marker,1)[1] != original_protected:
              raise SystemExit('QUESTION_AND_LOGIC_CHANGED')
          p.write_text(out,encoding='utf-8')
          PY
      - name: Validate canonical identity
        shell: bash
        run: |
          grep -q 'id="fullName"' index.html
          grep -q 'id="birthDate"' index.html
          grep -q 'id="date"' index.html
          grep -q 'Data de aplicação do rastreio' index.html
          grep -q 'Itens do questionário' index.html
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adiciona identificação canônica ao rastreio Borderline'
          git push
